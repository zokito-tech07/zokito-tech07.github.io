    x.textAlign='center';x.fillStyle='#fff';x.font='bold 13px system-ui,sans-serif';x.strokeText('HIZ x'+(speed()/140).toFixed(1),W/2,GY+60);x.fillText('HIZ x'+(speed()/140).toFixed(1),W/2,GY+60)}

</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=640;x.scale(2,2);
const ov=document.getElementById('ov'),muteB=document.getElementById('mute');
let state='menu',sc=0,hi=0,lives=3,t=0,wl=1,shield=0,shake=0,flash=0,fireT=0,spawnT=1,P,E=[],PB=[],EB=[],PU=[],PT=[],muted=false;
try{hi=+localStorage.getItem('ys_hi')||0}catch(e){}
const K={};let firing=false;

// ---------- Ses (Web Audio, harici dosya yok) ----------
let ac,master,nb;
function initAudio(){if(ac){ac.resume&&ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination)}catch(e){}}
function tone(f1,f2,d,type,v){if(!ac||muted)return;const s=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d)}
function noise(d,v,f){if(!ac||muted)return;if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.7,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=ac.currentTime,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();n.buffer=nb;fl.type='lowpass';fl.frequency.setValueAtTime(f,s);fl.frequency.exponentialRampToValueAtTime(100,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);n.connect(fl);fl.connect(g);g.connect(master);n.start(s);n.stop(s+d)}
const SFX={shoot:()=>tone(900,240,.08,'square',.035),boom:()=>noise(.4,.35,1800),big:()=>{noise(.7,.5,1200);tone(120,30,.5,'sawtooth',.2)},
  hit:()=>{tone(220,60,.25,'sawtooth',.2);noise(.25,.3,900)},tick:()=>tone(500,300,.04,'triangle',.05),
  power:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.12,'triangle',.12),i*70)),
  over:()=>[400,320,240,160].forEach((f,i)=>setTimeout(()=>tone(f,f*.8,.3,'sawtooth',.15),i*220))};
let mi=0;setInterval(()=>{if(state!=='play')return;const n=[55,55,82,73,55,55,98,82][mi++%8];tone(n,n,.2,'triangle',.1)},230);
muteB.onclick=()=>{muted=!muted;muteB.textContent=muted?'🔇':'🔊'};

// ---------- Hazır çizimler (performans için bir kez) ----------
function glow(c,r){const s=document.createElement('canvas');s.width=s.height=r*2;const g=s.getContext('2d'),q=g.createRadialGradient(r,r,0,r,r,r);q.addColorStop(0,c);q.addColorStop(.4,c.replace('1)','.35)'));q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,r*2,r*2);return s}
const GL={c:glow('rgba(110,215,255,1)',24),r:glow('rgba(255,80,90,1)',20),o:glow('rgba(255,160,70,1)',32),y:glow('rgba(255,225,100,1)',28),g:glow('rgba(90,255,160,1)',24),p:glow('rgba(150,100,255,1)',150),b:glow('rgba(60,140,255,1)',150)};
const BG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),l=g.createLinearGradient(0,0,0,H);l.addColorStop(0,'#05061a');l.addColorStop(.6,'#120a2c');l.addColorStop(1,'#0a1a36');g.fillStyle=l;g.fillRect(0,0,W,H);
  g.globalAlpha=.3;g.drawImage(GL.p,-60,60,300,300);g.drawImage(GL.b,150,300,300,300);g.drawImage(GL.p,100,480,260,260);return c})();
const VG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),r=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.72);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=r;g.fillRect(0,0,W,H);return c})();
const stars=[];for(let i=0;i<90;i++){const l=i%3;stars.push({x:Math.random()*W,y:Math.random()*H,s:.8+l*.7,sp:20+l*45})}
const poly=(p,c,s)=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fillStyle=c;x.fill();if(s){x.strokeStyle=s;x.lineWidth=1.5;x.stroke()}};
const gl=(k,px,py,r,a)=>{x.globalAlpha=a==null?1:a;x.drawImage(GL[k],px-r,py-r,r*2,r*2);x.globalAlpha=1};

// ---------- Oyun ----------
function start(){hideOv();firing=false;sc=0;lives=3;t=0;wl=1;shield=0;E=[];PB=[];EB=[];PU=[];PT=[];spawnT=1;fireT=0;P={x:W/2,y:520,tx:W/2,ty:520,inv:1};state='play'}
function fire(){const b=(dx,vx)=>PB.push({x:P.x+dx,y:P.y-18,vx,vy:-640});b(0,0);if(wl>=2){b(-9,-35);b(9,35)}if(wl>=3){b(-16,-130);b(16,130)}SFX.shoot()}
function spawn(){const r=Math.random(),k=t>25&&r<.15?'tank':t>10&&r<.35?'shoot':r<.6?'zig':'drone';
  const d={drone:[1,13,90],zig:[2,13,70],shoot:[3,15,70],tank:[8,22,38]}[k],hp=d[0]+(t>60?1:0),px=30+Math.random()*(W-60);
  E.push({k,x:px,bx:px,y:-30,hp,max:hp,r:d[1],vy:d[2]*(1+t*.003),ph:Math.random()*6,ft:1+Math.random(),fl:0})}
function aim(e){const n=e.k==='tank'?[-.25,0,.25]:[0],a=Math.atan2(P.y-e.y,P.x-e.x);for(const o of n)EB.push({x:e.x,y:e.y+8,vx:Math.cos(a+o)*175,vy:Math.sin(a+o)*175})}
function explode(px,py,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*220;PT.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.5,m:.9,g:Math.random()<.5?'o':'y',s:8+Math.random()*12})}
  PT.push({x:px,y:py,ring:1,r:4,l:.35,m:.35});if(PT.length>260)PT.splice(0,PT.length-260)}
function kill(e,ram){sc+=({drone:10,zig:20,shoot:35,tank:80})[e.k];explode(e.x,e.y,e.k==='tank'?32:16);e.k==='tank'?SFX.big():SFX.boom();shake=Math.max(shake,e.k==='tank'?6:2);
  if(!ram&&Math.random()<.15)PU.push({x:e.x,y:e.y,k:['w','s','h'][Math.random()*3|0]})}
function hurt(){if(P.inv>0)return;if(shield){shield=0;P.inv=.8;SFX.hit();explode(P.x,P.y,8);return}
  lives--;P.inv=1.6;shake=10;flash=.25;wl=Math.max(1,wl-1);SFX.hit();if(lives<=0)gameOver()}
function gameOver(){state='over';explode(P.x,P.y,60);SFX.big();setTimeout(SFX.over,500);
  if(sc>hi){hi=sc;try{localStorage.setItem('ys_hi',hi)}catch(e){}}
  setTimeout(()=>{if(state==='over')showOv('Oyun bitti','Skor: '+sc+' · Rekor: '+hi,'Tekrar oyna',start)},1100)}

function update(dt){
  t+=dt;P.x+=(P.tx-P.x)*Math.min(1,dt*14);P.y+=(P.ty-P.y)*Math.min(1,dt*14);P.inv-=dt;
  const sp=320*dt;if(K.ArrowLeft||K.KeyA)P.tx-=sp;if(K.ArrowRight||K.KeyD)P.tx+=sp;if(K.ArrowUp||K.KeyW)P.ty-=sp;if(K.ArrowDown||K.KeyS)P.ty+=sp;
  P.tx=Math.max(20,Math.min(W-20,P.tx));P.ty=Math.max(70,Math.min(H-30,P.ty));
  fireT-=dt;if(fireT<=0&&(firing||K.Space)){fireT=.17;fire()}
  spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.32,1.1-t*.008);spawn()}
  for(let i=PB.length-1;i>=0;i--){const b=PB[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20||b.x<-20||b.x>W+20)PB.splice(i,1)}
  for(let i=EB.length-1;i>=0;i--){const b=EB[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20){EB.splice(i,1);continue}
    if(Math.hypot(b.x-P.x,b.y-P.y)<13){EB.splice(i,1);hurt()}}
  for(let i=E.length-1;i>=0;i--){const e=E[i];e.fl-=dt;
    if(e.k==='zig'){e.y+=e.vy*dt;e.x=e.bx+Math.sin(t*3+e.ph)*60}
    else if(e.k==='drone'){e.y+=e.vy*dt;e.x=e.bx+Math.sin(t*1.5+e.ph)*20}
    else if(e.k==='shoot'){e.y+=e.y<110?e.vy*2*dt:6*dt;e.x=e.bx+Math.sin(t+e.ph)*50}
    else{e.y+=e.vy*dt;e.x=e.bx+Math.sin(t*.8+e.ph)*30}
    if((e.k==='shoot'||e.k==='tank')&&e.y>0&&e.y<H-150){e.ft-=dt;if(e.ft<=0){e.ft=e.k==='tank'?1.8:1.3;aim(e)}}
    if(e.y>H+40){E.splice(i,1);continue}
    let dead=false;
    for(let j=PB.length-1;j>=0;j--){const b=PB[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){PB.splice(j,1);e.hp--;e.fl=.08;SFX.tick();
      PT.push({x:b.x,y:b.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:.2,m:.2,g:'y',s:8});if(e.hp<=0){kill(e);dead=true;break}}}
    if(!dead&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+11){hurt();kill(e,1);dead=true}
    if(dead)E.splice(i,1)}
  for(let i=PU.length-1;i>=0;i--){const p=PU[i];p.y+=70*dt;if(p.y>H+20){PU.splice(i,1);continue}
    if(Math.hypot(p.x-P.x,p.y-P.y)<24){PU.splice(i,1);SFX.power();sc+=50;if(p.k==='w')wl=Math.min(3,wl+1);else if(p.k==='s')shield=1;else lives=Math.min(5,lives+1)}}
}
function fx(dt){
  for(const s of stars){s.y+=s.sp*dt*(state==='play'?1:.4);if(s.y>H){s.y=-4;s.x=Math.random()*W}}
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}if(p.ring)p.r+=300*dt;else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98}}
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);
}

// ---------- Çizim ----------
function drawEnemy(e){x.save();x.translate(e.x,e.y);const f=e.fl>0;
  if(e.k==='drone'){poly([[0,14],[12,4],[10,-10],[0,-14],[-10,-10],[-12,4]],f?'#fff':'#8a4fff','#d6b8ff');x.fillStyle='#ff4d6d';x.beginPath();x.arc(0,0,4,0,6.283);x.fill()}
  else if(e.k==='zig'){poly([[0,15],[14,-10],[0,-4],[-14,-10]],f?'#fff':'#ff8a3d','#ffd0a0');x.fillStyle='#fff3';x.fillRect(-2,-2,4,8)}
  else if(e.k==='shoot'){x.fillStyle=f?'#fff':'#2fbf7a';x.beginPath();x.arc(0,0,15,0,6.283);x.fill();x.strokeStyle='#a8ffd4';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,2,6,0,6.283);x.fill();x.fillStyle='#103';x.beginPath();x.arc(0,3,3,0,6.283);x.fill()}
  else{poly([[-10,-22],[10,-22],[22,-8],[22,8],[10,22],[-10,22],[-22,8],[-22,-8]],f?'#fff':'#5b6f8f','#a8c0e8');x.fillStyle='#2b3850';x.fillRect(-5,-10,10,26);x.fillStyle='#ff4d6d';x.beginPath();x.arc(0,-2,5,0,6.283);x.fill()}
  x.restore();
  if(e.hp<e.max){x.fillStyle='#0008';x.fillRect(e.x-14,e.y-e.r-9,28,4);x.fillStyle='#ff4d6d';x.fillRect(e.x-13,e.y-e.r-8,26*e.hp/e.max,2)}}
function drawPlayer(){if(P.inv>0&&Math.floor(t*14)%2)return;x.save();x.translate(P.x,P.y);
  const fl=10+Math.random()*9;poly([[-5,14],[5,14],[0,14+fl]],'#ffb347');poly([[-2.5,14],[2.5,14],[0,14+fl*.55]],'#fff7d0');
  const g=x.createLinearGradient(0,-22,0,16);g.addColorStop(0,'#f2fbff');g.addColorStop(1,'#3f8fe8');
  poly([[0,-22],[7,-6],[18,12],[9,10],[5,16],[-5,16],[-9,10],[-18,12],[-7,-6]],g,'#bfe6ff');
  x.fillStyle='#10244a';x.beginPath();x.ellipse(0,-3,3.5,7,0,0,6.283);x.fill();x.fillStyle='#7fd4ff88';x.beginPath();x.ellipse(-1,-5,1.5,3,0,0,6.283);x.fill();x.restore();
  x.globalCompositeOperation='lighter';gl('o',P.x,P.y+22,22,.5);x.globalCompositeOperation='source-over';
  if(shield){x.strokeStyle='rgba(120,220,255,'+(.55+.25*Math.sin(t*8))+')';x.lineWidth=2.5;x.beginPath();x.arc(P.x,P.y,27,0,6.283);x.stroke()}}
function draw(){
  x.save();x.drawImage(BG,0,0);
  x.fillStyle='#fff';for(const s of stars){x.globalAlpha=.25+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s*(1+s.sp*.03))}x.globalAlpha=1;
  if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(const p of PU){const c={w:'y',s:'c',h:'g'}[p.k],yy=p.y+Math.sin(t*5+p.x)*3;x.globalCompositeOperation='lighter';gl(c,p.x,yy,24,.9);x.globalCompositeOperation='source-over';
    x.fillStyle='#fff';x.font='bold 15px system-ui';x.textAlign='center';x.fillText({w:'W',s:'S',h:'+'}[p.k],p.x,yy+5)}
  for(const e of E)drawEnemy(e);
  x.globalCompositeOperation='lighter';
  for(const b of PB){gl('c',b.x,b.y,15,.9)}for(const b of EB){gl('r',b.x,b.y,13,.95)}
  x.globalCompositeOperation='source-over';
  x.fillStyle='#fff';for(const b of PB)x.fillRect(b.x-1.5,b.y-8,3,12);x.fillStyle='#ffd6d6';for(const b of EB){x.beginPath();x.arc(b.x,b.y,3.2,0,6.283);x.fill()}
  if(state!=='over')drawPlayer();
  x.globalCompositeOperation='lighter';
  for(const p of PT){const a=p.l/p.m;if(p.ring){x.strokeStyle='rgba(255,200,120,'+a+')';x.lineWidth=3*a;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.stroke()}else gl(p.g,p.x,p.y,p.s*(.5+a),Math.min(1,a*1.5))}
  x.globalCompositeOperation='source-over';x.restore();
  x.drawImage(VG,0,0);
  if(flash){x.fillStyle='rgba(255,60,60,'+Math.min(.4,flash*1.6)+')';x.fillRect(0,0,W,H)}
  if(state!=='menu'){x.textAlign='left';x.fillStyle='#fff';x.font='bold 24px system-ui,sans-serif';x.fillText(sc,14,32);
    x.font='11px system-ui,sans-serif';x.fillStyle='#9fb0d0';x.fillText('REKOR '+Math.max(hi,sc),14,48);
    x.font='18px system-ui,sans-serif';x.fillStyle='#ff4d6d';for(let i=0;i<lives;i++)x.fillText('♥',14+i*20,72);
    x.font='11px system-ui,sans-serif';x.fillStyle='#ffe164';x.fillText('SİLAH '+'▮'.repeat(wl),14,90);if(shield){x.fillStyle='#7fe0ff';x.fillText('KALKAN',90,90)}}
}

// ---------- Arayüz ve girdi ----------
function showOv(h,p,b,fn){ov.style.display='flex';ov.innerHTML='<h1>'+h+'</h1><p>'+p+'</p><button>'+b+'</button>';ov.querySelector('button').onclick=()=>{initAudio();fn()}}
function hideOv(){ov.style.display='none'}
function pause(){if(state!=='play')return;firing=false;state='pause';showOv('Duraklatıldı','Oyun durdu.','Devam et',()=>{hideOv();state='play'})}
function mv(e){if(state!=='play')return;e.preventDefault();const r=cv.getBoundingClientRect();P.tx=(e.clientX-r.left)*W/r.width;P.ty=(e.clientY-r.top)*H/r.height-(e.pointerType==='mouse'?0:70)}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}firing=true;mv(e)});
addEventListener('pointerup',()=>firing=false);addEventListener('pointercancel',()=>firing=false);
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)mv(e)});
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(e.code==='Escape'||e.code==='KeyP')pause();if(e.code==='KeyM')muteB.onclick()});
addEventListener('keyup',e=>K[e.code]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();last=performance.now()});

let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(state==='play')update(dt);fx(dt);draw();requestAnimationFrame(loop)}
P={x:W/2,y:520,tx:W/2,ty:520,inv:0};
showOv('Yıldız Savaşı','Parmağınla sürükle ya da fare / WASD kullan. Ateş için tıkla veya basılı tut (Boşluk da çalışır). W, S ve + güçlendirmelerini topla.','Başla',start);
requestAnimationFrame(loop);
</script>
</body>
</html>

</template>
<template id="g-beatball">
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beatball Soccer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3d8a33;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#ui>*{pointer-events:auto}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{position:relative;width:132px;height:150px;border-radius:10px;background:linear-gradient(#1b1d24,#101218);border:1px solid #ffffff1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:#ff5c8a}
.card small{color:#8a8f9d;font-size:11px}.card h2{margin:0;font-size:34px}.card em{font-style:normal;font-size:11px;color:#ff5c8a}
.card .badge{position:absolute;top:-8px;background:#e8344f;border-radius:6px;font-size:9px;padding:2px 8px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;background:#12141ae0;border-radius:10px;padding:8px 10px;font-size:13px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;padding:7px 12px;background:#242733;color:#aab;cursor:pointer;font:inherit}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:#ff5c8a;color:#fff;font-weight:700}
input{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid #ffffff33;background:#1a1d27;color:#fff;width:130px;text-align:center}
.panel{background:#12141aee;border:1px solid #ffffff1a;border-radius:14px;padding:20px 26px;text-align:center;min-width:260px;max-width:92vw}
.panel h2{margin:0 0 8px}.panel p{margin:0 0 14px;color:#b6bbca;font-size:14px;line-height:1.5}
.btn{border:0;border-radius:10px;padding:10px 22px;margin:3px;font:inherit;font-weight:700;color:#fff;background:#ff5c8a;cursor:pointer}
.btn.g{background:#2d3140}
.btn:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid #fff}
h1{margin:0 0 14px;font-size:clamp(28px,6vw,46px);letter-spacing:4px;text-shadow:0 3px 14px #0006}
h1 small{display:block;font-size:11px;letter-spacing:1px;font-weight:400;opacity:.8}
#bot{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);border:0;border-radius:8px;background:#000a;color:#fff;padding:4px 18px;font-size:12px;cursor:pointer;display:none;pointer-events:auto}
#hint{position:fixed;left:10px;bottom:8px;font-size:11px;color:#fff;opacity:.85;text-shadow:0 1px 3px #000;pointer-events:none;display:none;line-height:1.5}
#mute{position:fixed;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:#0006;color:#fff;font-size:16px;cursor:pointer}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.touch #touch{display:block}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #fff5;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#fff8}
#kb{position:absolute;right:24px;bottom:30px;width:96px;height:96px;border-radius:50%;background:#ff5c8aaa;border:2px solid #fff7;display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:auto;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<button id="bot">Menu</button>
<div id="hint">WASD hareket (baktığın yöne vurursun) · Boşluk / Tık: vur · Shift: koş · Tab: skor · 2 sn temas sonrası vur: Power Shot</div>
<button id="mute" aria-label="Ses">🔊</button>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="kb">VUR</div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),ui=$('ui');
const FW=1200,FH=580,GD=70,GW=200,GY0=(FH-GW)/2,PR=22,BR=14,MAXV=212;
let VW=innerWidth,VH=innerHeight,DPR=1;
function fit(){DPR=Math.min(devicePixelRatio||1,2.5);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR}addEventListener('resize',fit);fit();
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;if(isTouch)document.body.classList.add('touch');
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ls=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};

// ---------- Ses ----------
let ac,master,nb,muted=false;
function initAudio(){if(ac){ac.resume&&ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination)}catch(e){}}
function tone(f1,f2,d,ty,v){if(!ac||muted)return;const s=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d)}
function noise(d,v,f){if(!ac||muted)return;if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=ac.currentTime,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();n.buffer=nb;fl.type='lowpass';fl.frequency.setValueAtTime(f,s);fl.frequency.exponentialRampToValueAtTime(100,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);n.connect(fl);fl.connect(g);g.connect(master);n.start(s);n.stop(s+d)}
const arp=(a,ty,v,gap)=>a.forEach((f,i)=>setTimeout(()=>tone(f,f,.14,ty,v),i*gap));
const SFX={kick:()=>{tone(180,60,.12,'sine',.3);noise(.08,.15,1500)},bump:()=>tone(240,160,.05,'triangle',.07),wall:()=>tone(300,200,.04,'triangle',.05),
  goal:()=>{arp([523,659,784,1047],'triangle',.14,90);noise(.9,.18,3000)},whistle:()=>{tone(2200,2100,.25,'sine',.12);setTimeout(()=>tone(2200,2100,.35,'sine',.12),300)},click:()=>tone(600,500,.05,'square',.04),power:()=>{tone(200,900,.25,'sawtooth',.18);noise(.3,.3,2500)}};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};

// ---------- Durum ----------
const BOTN=['Leo','Mrnonchalant','Cr7fan','koolcheems86','Pasha','Zeki','Mert','Aslan','Deniz','Kaan','Efe','Ronaldinho'];
let G=null,scene='menu',paused=false,modeSel='1v1',wantReal=true,myName=ls('bb_name','Sen'),myPeer='local',tgt=null,qT=0,uiT=0,tTime=0,toastT=0,toastTxt='',showTab=false;
let net=null,snap=[];const done=new Set();
const cam={x:FW/2,y:FH/2,z:1},mouse={x:0,y:0,on:false},keys={};let joy={x:0,y:0},tAim=null,pubT=0;
const peersAll=()=>snap.filter(p=>p.kind==='viewer');
const toast=m=>{toastTxt=m;toastT=2.6};

// ---------- Ağ (claude room / presence) ----------
async function netInit(){try{if(!(window.claude&&claude.use))return;const r=await claude.use('room');if(!r)return;net=r;r.onPeers(c=>{snap=c.peers},()=>{net=null})}catch(e){net=null}}
function pub(){if(!net)return;const o={nm:myName};
  if(scene==='queue')o.g=tgt.key;
  if(G&&!G.demo){o.mid=G.id;const me=G.me;
    if(G.host){o.m={id:G.id,pl:G.plids,mode:G.mode,nm:G.pl.map(p=>p.name)};
      o.st={s:G.s,t:Math.ceil(G.time),ot:G.ot?1:0,ph:G.ph,ge:G.ge,gn:G.gn||'',b:[G.ball.x|0,G.ball.y|0,G.ball.vx|0,G.ball.vy|0],pp:G.pl.map(p=>[p.x|0,p.y|0,p.vx|0,p.vy|0,Math.round(p.aim*100)]),gl:G.pl.map(p=>p.goals),tn:G.thN,tl:G.thL,pw:G.pwN,pwn:G.pwn,cp:G.cp?[G.cp.i,+G.cT.toFixed(1)]:0}}
    else if(me)o.p=[me.x|0,me.y|0,me.vx|0,me.vy|0,+me.aim.toFixed(2),me.kc]}
  try{Promise.resolve(net.presence(o)).catch(()=>{})}catch(e){}}

// ---------- Oyun kurulumu ----------
function mkGame(mode,pl,names,host,id,demo){
  const n=mode==='1v1'?2:4,P=[];
  for(let i=0;i<n;i++){const peer=pl[i]||null;P.push({i,team:i%2,x:0,y:0,vx:0,vy:0,aim:i%2?Math.PI:0,kc:0,lkc:0,kcd:0,peer,bot:!peer,goals:0,name:(names&&names[i])||BOTN[(Math.random()*BOTN.length)|0],lvl:rnd(.72,.95),tx:0,ty:0})}
  const g={id,mode,n,pl:P,plids:pl.slice(),host,demo:!!demo,s:[0,0],time:180,ot:0,ge:0,pwN:0,pwT:0,cp:null,cT:0,cg:0,cpi:-1,pwn:'',thN:0,thL:[],stk:0,gn:'',ph:'count',pt:1.1,fx:[],trail:[],ball:{x:FW/2,y:FH/2,vx:0,vy:0},lt:null,me:P.find(p=>p.peer===myPeer)||null};
  if(g.me)g.me.name=myName;kickoff(g);return g}
function kickoff(g){g.ball.x=FW/2;g.ball.y=FH/2;g.ball.vx=g.ball.vy=0;const ts=g.n/2;
  for(const p of g.pl){const k=p.i>>1,fx_=ts===1?.28:(k?.3:.16);p.x=p.team?FW*(1-fx_):FW*fx_;p.y=ts===1?FH/2:(k?FH*.7:FH*.3);p.vx=p.vy=0;p.tx=p.x;p.ty=p.y}
  g.ph='count';g.pt=1.1;g.lt=null;g.trail=[];g.cp=null;g.cT=0;if(!g.demo)SFX.whistle()}
function hostMatch(pl){const id=Math.random().toString(36).slice(2,8),m=tgt.mode;
  const names=pl.map(pe=>pe===myPeer?myName:((peersAll().find(q=>q.peer===pe)||{}).presence||{}).nm||'Oyuncu');
  G=mkGame(m,pl.length?pl:['local'],names,true,id);if(!pl.length)myPeer='local',G.me=G.pl[0],G.pl[0].peer='local',G.pl[0].bot=false,G.pl[0].name=myName;
  G.me&&(G.me.name=myName);go()}
function joinMatch(hp,m){done.add(m.id);G=mkGame(m.mode,m.pl,m.nm,false,m.id);G.client=true;G.hostPeer=hp;G.me=G.pl.find(p=>p.peer===myPeer);G.hasSt=false;go()}
function go(){scene='play';paused=false;ui.innerHTML='';$('bot').style.display='block';$('hint').style.display=isTouch?'none':'block';tgt&&(tgt.manual=0)}
function leave(msg){if(G&&G.id)done.add(G.id);G=null;scene='menu';if(msg)setTimeout(()=>toast(msg),50);$('bot').style.display='none';$('hint').style.display='none';demo();menu()}
function demo(){G=mkGame('2v2',[],null,true,'demo',true);G.demo=true}

// ---------- Eşleşme ----------
function queueTick(dt){qT+=dt;const key=tgt.key,all=peersAll(),mp=all.find(p=>p.isMe&&p.sameTab);if(mp)myPeer=mp.peer;
  for(const p of all){const m=p.presence&&p.presence.m;if(m&&!p.isMe&&Array.isArray(m.pl)&&m.pl.includes(myPeer)&&!done.has(m.id)&&p.presence.st&&p.presence.st.ph!=='end')return joinMatch(p.peer,m)}
  const cand=all.filter(p=>p.presence&&p.presence.g===key&&!p.presence.mid).map(p=>p.peer).sort(),need=tgt.n;
  if(tgt.manual){if(cand[0]===myPeer&&tgt.start){tgt.start=0;const n=cand.length>2?4:2;tgt.mode=n===4?'2v2':'1v1';hostMatch(cand.slice(0,n))}}
  else if(net&&cand[0]===myPeer){if(cand.length>=need||qT>5)hostMatch(cand.slice(0,need))}
  else if(qT>(net?8:2.2))hostMatch([]);
  uiT-=dt;if(uiT<=0){uiT=.4;const q=$('qinfo');if(q)q.textContent=tgt.manual?'Odadaki oyuncular: '+cand.length+(cand[0]===myPeer?' (host sensin)':''):'Bulunan oyuncu: '+Math.min(cand.length,need)+'/'+need+(net?'':' (çevrimiçi bağlantı yok → botlar)')}}
function startQueue(mode,key,manual){tgt={mode,key,n:mode==='1v1'?2:4,manual,start:0};qT=0;scene='queue';G=null;
  ui.innerHTML=`<div class="panel"><h2>${manual?'Oda: '+key.slice(2):'Rakip aranıyor…'}</h2><p id="qinfo">…</p><p>${manual?'Arkadaşların aynı kodu girsin. Host "Başlat" der, eksikler botla dolar.':'5 sn içinde bulunamazsa boş yerler botlarla dolar.'}</p>${manual?'<button class="btn" id="go">Başlat</button>':''}<button class="btn g" id="cx">İptal</button></div>`;
  if($('go'))$('go').onclick=()=>{tgt.start=1};$('cx').onclick=()=>{scene='menu';tgt=null;pub();demo();menu()}}

// ---------- Fizik ----------
function capV(b,m){const s=Math.hypot(b.vx,b.vy);if(s>m){b.vx*=m/s;b.vy*=m/s}}
function inGoalY(y){return y>GY0+BR*.4&&y<GY0+GW-BR*.4}
function ballStep(dt){const b=G.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;const f=Math.pow(G.pwT>0?.62:.42,dt);b.vx*=f;b.vy*=f;capV(b,G.pwT>0?1100:800);
  if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy)*.8;SFX.wall()}if(b.y>FH-BR){b.y=FH-BR;b.vy=-Math.abs(b.vy)*.8;SFX.wall()}
  const inL=b.x<0,inR=b.x>FW;
  if(inL||inR){if(b.y<GY0+BR){b.y=GY0+BR;b.vy=Math.abs(b.vy)*.6}if(b.y>GY0+GW-BR){b.y=GY0+GW-BR;b.vy=-Math.abs(b.vy)*.6}
    if(b.x<-GD+BR){b.x=-GD+BR;b.vx=Math.abs(b.vx)*.4}if(b.x>FW+GD-BR){b.x=FW+GD-BR;b.vx=-Math.abs(b.vx)*.4}}
  else{if(b.x<BR&&!inGoalY(b.y)){b.x=BR;b.vx=Math.abs(b.vx)*.8;SFX.wall()}if(b.x>FW-BR&&!inGoalY(b.y)){b.x=FW-BR;b.vx=-Math.abs(b.vx)*.8;SFX.wall()}}b.x=Math.max(-GD+BR,Math.min(FW+GD-BR,b.x));b.y=Math.max(BR,Math.min(FH-BR,b.y))}
function kick(p,ang,tol){const g=G;if(p.kcd>0)return;p.kcd=.35;g.fx.push({x:p.x,y:p.y,t:.25,r:1});const b=g.ball;if(dist(p,b)>PR+BR+(tol?26:14))return;if(g.cp===p&&g.cT>=2)return powerShot(p,ang);
  b.vx=Math.cos(ang)*560+p.vx*.25;b.vy=Math.sin(ang)*560+p.vy*.25;capV(b,800);g.lt=p;g.fx.push({x:b.x,y:b.y,a:ang,t:.55,c:1});SFX.kick()}
function ballHit(p){const b=G.ball,dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=PR+BR;if(d>=m||d===0)return;const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;
  const rel=(b.vx-p.vx)*nx+(b.vy-p.vy)*ny;if(rel<0){const j=-1.35*rel/1.2;b.vx+=nx*j;b.vy+=ny*j;if(rel<-90)SFX.bump()}G.lt=p}
function moveP(p,dx,dy,dt){p.x=Math.max(-16,Math.min(FW+16,p.x+dx*dt));p.y=Math.max(-16,Math.min(FH+16,p.y+dy*dt))}
function drive(p,dt){if(p.kt>0){p.kt-=dt;moveP(p,p.kx,p.ky,dt);const f=Math.pow(.03,dt);p.kx*=f;p.ky*=f}let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const sp=MAXV*(keys.ShiftLeft||keys.ShiftRight?1.22:1),k=Math.min(1,dt*(m>0?9:6));p.vx+=(ix*sp-p.vx)*k;p.vy+=(iy*sp-p.vy)*k;moveP(p,p.vx,p.vy,dt);
  if(m>.15){const a=Math.atan2(iy,ix);let d=a-p.aim;d=Math.atan2(Math.sin(d),Math.cos(d));p.aim+=d*Math.min(1,dt*18)}}
function ai(p,dt){if(p.kt>0){p.kt-=dt;moveP(p,p.kx,p.ky,dt);const f=Math.pow(.03,dt);p.kx*=f;p.ky*=f}const g=G,b=g.ball,own=p.team?FW:0,tg=p.team?0:FW,mates=g.pl.filter(q=>q.team===p.team);let ch=mates[0];for(const q of mates)if(dist(q,b)<dist(ch,b))ch=q;
  let tx,ty;const sp=MAXV*.9*p.lvl;
  if(ch===p){const a=Math.atan2(FH/2-b.y,tg-b.x),d=dist(p,b);if(d<70){tx=b.x;ty=b.y}else{tx=b.x-Math.cos(a)*30;ty=b.y-Math.sin(a)*30}
    if(d<PR+BR+9&&p.kcd<=0&&Math.random()<dt*7)kick(p,a+rnd(-.22,.22))}
  else{tx=own+(b.x-own)*.4;ty=FH/2+(b.y-FH/2)*.55}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,v=Math.min(sp,d*5);p.vx+=(dx/d*v-p.vx)*Math.min(1,dt*7);p.vy+=(dy/d*v-p.vy)*Math.min(1,dt*7);moveP(p,p.vx,p.vy,dt);p.aim=Math.atan2(b.y-p.y,b.x-p.x)}
function remote(p,dt){const e=peersAll().find(q=>q.peer===p.peer),a=e&&e.presence&&e.presence.p;
  if(!a){if((p.miss=(p.miss||0)+dt)>2.5){p.bot=true;p.peer=null;toast(p.name+' ayrıldı, yerine bot geldi')}return}p.miss=0;
  p.x+=(a[0]-p.x)*Math.min(1,dt*18);p.y+=(a[1]-p.y)*Math.min(1,dt*18);p.vx=a[2];p.vy=a[3];p.aim=a[4];if(a[5]!==p.lkc){p.lkc=a[5];kick(p,p.aim,1)}}
function flames(dt){const g=G,b=g.ball;g.fl=g.fl||[];if(g.pwT>0){const sp=Math.hypot(b.vx,b.vy)||1;for(let i=0;i<3;i++)g.fl.push({x:b.x-b.vx/sp*BR*.6+rnd(-4,4),y:b.y-b.vy/sp*BR*.6+rnd(-4,4),vx:-b.vx*.08+rnd(-30,30),vy:-b.vy*.08+rnd(-30,30)-20,t:.5,r:rnd(6,13)})}
  for(const f of g.fl){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}g.fl=g.fl.filter(f=>f.t>0);if(g.fl.length>120)g.fl.splice(0,g.fl.length-120)}
function powerShot(p,ang){const g=G,b=g.ball;g.cT=0;g.cp=null;g.cpi=-1;b.vx=Math.cos(ang)*1000+p.vx*.25;b.vy=Math.sin(ang)*1000+p.vy*.25;capV(b,1100);g.pwT=1.4;g.lt=p;g.pwN++;g.pwn=p.name;g.fx.push({x:b.x,y:b.y,t:.5,r:1});g.fx.push({x:p.x,y:p.y,t:.3,r:1});toast('POWER SHOT! '+(p===g.me?'':p.name));SFX.power()}
function fling(tc){const g=G,b=g.ball;g.thL=[];for(const p of tc){let dx=p.x-b.x,dy=p.y-b.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;p.kx=dx*640;p.ky=dy*640;p.kt=.45;g.thL.push([p.i,p.kx|0,p.ky|0]);g.fx.push({x:p.x,y:p.y,t:.25,r:1})}g.thN++;const cx=FW/2-b.x,cy=FH/2-b.y,cd=Math.hypot(cx,cy)||1;b.vx+=cx/cd*220;b.vy+=cy/cd*220;SFX.bump()}
function score(team){const g=G;g.s[team]++;if(g.lt)g.lt.goals++;g.gn=g.lt?g.lt.name:'';g.ph='goal';g.sc=team;g.pt=2.4;g.ge++;toast((g.gn||'Takım')+' scored');SFX.goal()}
function step(dt){const g=G;g.fx=g.fx.filter(f=>(f.t-=dt)>0);
  if(g.ph==='end')return;
  if(g.ph==='count'){g.pt-=dt;if(g.pt<=0)g.ph='play';return}
  if(g.ph==='goal'){g.pt-=dt;ballStep(dt*.5);g.pwT-=dt;flames(dt);if(g.pt<=0){if(g.demo||!(g.ot||(g.time<=0&&g.s[0]!==g.s[1])))kickoff(g);else finish()}return}
  if(!g.demo&&!g.ot){g.time-=dt;if(g.time<=0){if(g.s[0]!==g.s[1])return finish();g.ot=1;g.time=0;toast('ALTIN GOL!')}}
  for(const p of g.pl){p.kcd-=dt;if(p===g.me)drive(p,dt);else if(p.bot)ai(p,dt);else remote(p,dt)}
  for(let i=0;i<g.pl.length;i++)for(let j=i+1;j<g.pl.length;j++){const a=g.pl[i],c=g.pl[j],d=dist(a,c);if(d<PR*2&&d>0){const o=(PR*2-d)/2,nx=(a.x-c.x)/d,ny=(a.y-c.y)/d;a.x+=nx*o;a.y+=ny*o;c.x-=nx*o;c.y-=ny*o}}
  for(const p of g.pl)ballHit(p);ballStep(dt);const b=g.ball;g.pwT-=dt;
  {let tc=null,bd=1e9;for(const p of g.pl){const d=dist(p,b);if(d<PR+BR+3&&d<bd){bd=d;tc=p}}
  if(tc){g.cg=0;if(g.cp===tc)g.cT=Math.min(2.5,g.cT+dt);else{g.cp=tc;g.cT=0}}else{g.cg+=dt;if(g.cg>.2){g.cp=null;g.cT=0}}
  g.cpi=g.cp?g.cp.i:-1}flames(dt);
  if(Math.hypot(b.vx,b.vy)>300)g.trail.push({x:b.x,y:b.y,t:.35});for(const q of g.trail)q.t-=dt;g.trail=g.trail.filter(q=>q.t>0);
  {const sp=Math.hypot(b.vx,b.vy),tc=g.pl.filter(p=>dist(p,b)<PR+BR+4),nw=b.x<BR+3||b.x>FW-BR-3||b.y<BR+3||b.y>FH-BR-3;if(sp<70&&(tc.length>=2||(tc.length>=1&&nw)))g.stk+=dt;else g.stk=0;if(g.stk>.6){g.stk=0;fling(tc)}}
  if(b.x<-6&&inGoalY(b.y))score(1);else if(b.x>FW+6&&inGoalY(b.y))score(0)}
function stepClient(dt){const g=G,h=peersAll().find(p=>p.peer===g.hostPeer);if(!h){leave('Host bağlantısı koptu');return}
  const s=h.presence&&h.presence.st;g.fx=g.fx.filter(f=>(f.t-=dt)>0);
  if(s&&s!==g.raw){g.raw=s;g.at=tTime;g.s=s.s;g.time=s.t;g.ot=s.ot;g.sb=s.b;if(s.tn!==g.tn){g.tn=s.tn;for(const e of s.tl||[])if(g.me&&e[0]===g.me.i){g.me.kx=e[1];g.me.ky=e[2];g.me.kt=.45}}if(s.pw>g.pwN){toast('POWER SHOT! '+(s.pwn||''));SFX.power();g.pwT=1.4}g.pwN=s.pw;g.cpi=s.cp?s.cp[0]:-1;g.cT=s.cp?s.cp[1]:0;
    if(s.ge!==g.ge){g.ge=s.ge;if(s.ge>0){toast((s.gn||'Takım')+' scored');SFX.goal()}}
    if(s.ph==='end'&&g.ph!=='end'){g.ph='end';finish()}else if(s.ph==='count'&&g.ph!=='count')SFX.whistle();if(g.ph!=='end')g.ph=s.ph;
    g.pl.forEach((p,i)=>{p.goals=s.gl[i];if(p!==g.me){const a=s.pp[i];p.tx=a[0];p.ty=a[1];p.vx=a[2];p.vy=a[3];p.aim=a[4]/100}})}
  if(g.ph==='play'||g.ph==='goal'){if(g.me&&g.ph==='play')drive(g.me,dt)}else if(g.me&&s){const a=s.pp[g.me.i];g.me.x=a[0];g.me.y=a[1];g.me.vx=g.me.vy=0}

<!DOCTYPE html>

<head>

<style>
  * { box-sizing: border-box; }
  html, body {

<body>

<script>
// ==PHYS-START==
const T = 40, W = 800, H = 450, GROUND = 360;
const SPEED = 340, GRAV = 2500, JUMP = 700, P = 40, STEP = 1 / 120;
let spikes = [], blocks = [], END = 0;

function buildLevel() {
  spikes = []; blocks = [];
  const S = (tx, lift) => spikes.push({ x: tx * T, base: GROUND - (lift || 0) * T });
  const Bk = (tx, wt, ht) => blocks.push({ x: tx * T, y: GROUND - ht * T, w: wt * T, h: ht * T });
  const SEG = {
    A: (x) => { S(x); return 1; },
    B: (x) => { S(x); S(x + 1); return 2; },
    C: (x) => { S(x); S(x + 1); S(x + 2); return 3; },
    D: (x) => { Bk(x, 1, 1); return 1; },
    E: (x) => { Bk(x, 3, 2); return 3; },
    F: (x) => { Bk(x, 2, 1); Bk(x + 2, 2, 2); Bk(x + 4, 2, 1); return 6; },
    G: (x) => { Bk(x, 3, 2); S(x + 3); S(x + 4); return 5; },
    H: (x) => { Bk(x, 9, 1); S(x + 6, 1); return 9; },
    I: (x) => { S(x); Bk(x + 4, 2, 1); return 6; }
  };
  const PLAN = [
    ['A',8],['A',8],['B',8],['D',7],['A',7],['E',8],['B',7],['I',8],['C',9],['F',9],
    ['G',9],['A',6],['A',6],['B',6],['H',8],['D',6],['E',6],['C',8],['I',7],['G',8],
    ['B',5],['A',5],['F',8],['H',7],['C',7],['A',5],['B',6],['E',5],['G',7],['C',7],
    ['I',6],['H',6],['B',5],['A',6]
  ];
  let x = 14;
  PLAN.forEach(([k, gap]) => { x += SEG[k](x) + gap; });
  END = (x + 4) * T;
}

function newPlayer() { return { x: 0, y: GROUND - P, vy: 0, ground: true, dead: false, jumped: false }; }

function stepPlayer(p, hold, dt) {
  p.jumped = false;
  const prevBottom = p.y + P;
  if (hold && p.ground) { p.vy = -JUMP; p.ground = false; p.jumped = true; }
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  p.x += SPEED * dt;
  p.ground = false;
  if (p.y + P >= GROUND) { p.y = GROUND - P; p.vy = 0; p.ground = true; }

  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.x > p.x + P + 10 || b.x + b.w < p.x - 10) continue;
    if (p.x + P - 2 > b.x && p.x + 2 < b.x + b.w && p.y + P > b.y && p.y < b.y + b.h) {
      if (p.vy >= 0 && prevBottom <= b.y + 12) { p.y = b.y - P; p.vy = 0; p.ground = true; }
      else { p.dead = true; return; }
    }
  }
  for (let i = 0; i < spikes.length; i++) {
    const s = spikes[i];
    if (s.x > p.x + P + 10 || s.x + T < p.x - 10) continue;
    const sx = s.x + 11, sw = 18, sy = s.base - 26, sh = 26;
    if (p.x + P - 5 > sx && p.x + 5 < sx + sw && p.y + P - 5 > sy && p.y + 5 < sy + sh) { p.dead = true; return; }
  }
}
// ==PHYS-END==

(function () {
  buildLevel();

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const startScreen = document.getElementById('startScreen');
  const winScreen = document.getElementById('winScreen');
  const winText = document.getElementById('winText');
  const muteBtn = document.getElementById('mute');
  let scale = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = w * H / W;
    if (h > vh) { h = vh; w = h * W / H; }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = cv.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- durum ----------
  let state = 'ready';
  let p = newPlayer();
  let attempt = 1, best = 0, deadT = 0, rot = 0, time = 0, acc = 0, trailT = 0;
  let hold = false;
  let particles = [];
  try { best = Number(localStorage.getItem('nk_best')) || 0; } catch (e) {}

  const pct = () => Math.min(100, Math.floor((p.x / END) * 100));
  function saveBest(v) {
    if (v > best) { best = v; try { localStorage.setItem('nk_best', String(best)); } catch (e) {} }
  }

  function burst() {
    const cx = p.x + P / 2, cy = p.y + P / 2;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 380;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
        life: 0.7 + Math.random() * 0.4, max: 1.1, s: 5 + Math.random() * 8, c: Math.random() < 0.5 ? '#3ef0ff' : '#ffffff' });
    }
  }

  function die() {
    state = 'dead';
    deadT = 0.75;
    saveBest(pct());
    sfxDie();
    burst();
  }

  function restart() {
    p = newPlayer(); rot = 0; acc = 0; particles = [];
    attempt++;
    state = 'playing';
  }

  function win() {
    state = 'won';
    saveBest(100);
    winText.textContent = attempt + ' denemede bölümü bitirdin. Bir tur daha atmak ister misin?';
    winScreen.hidden = false;
  }

  function startGame() {
    initAudio();
    hold = false;
    p = newPlayer(); rot = 0; acc = 0; particles = []; attempt = 1;
    startScreen.hidden = true;
    winScreen.hidden = true;
    state = 'playing';
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  // ---------- girdi ----------
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.overlay') || e.target === muteBtn) return;
    hold = true;
  });
  window.addEventListener('pointerup', () => { hold = false; });
  window.addEventListener('pointercancel', () => { hold = false; });
  window.addEventListener('blur', () => { hold = false; });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code === 'Space') return;
      hold = true;
    } else if (e.code === 'KeyM') { toggleMute(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') hold = false;
  });

  // ---------- ses ----------
  let AC = null, master = null, muted = false, stepIdx = 0, nextT = 0;
  const BPM = 128, EIGHTH = 60 / BPM / 2;
  const ARP = [220, 261.6, 329.6, 261.6, 220, 261.6, 329.6, 392, 196, 246.9, 293.7, 246.9, 196, 246.9, 293.7, 370];

  function initAudio() {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      master = AC.createGain();
      master.gain.value = 0.35;
      master.connect(AC.destination);
      nextT = AC.currentTime + 0.1;
      setInterval(sched, 80);
    }
    if (AC.state === 'suspended') AC.resume();
  }
  function tone(f0, f1, t, dur, type, vol) {
    if (!AC || muted) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sched() {
    if (!AC) return;
    if (state !== 'playing' && state !== 'dead') { nextT = AC.currentTime + 0.05; return; }
    while (nextT < AC.currentTime + 0.25) {
      const i = stepIdx % 16;
      if (i % 2 === 0) tone(150, 40, nextT, 0.14, 'sine', 0.9);
      tone(i < 8 ? 110 : 98, i < 8 ? 110 : 98, nextT, EIGHTH * 0.9, 'sawtooth', 0.07);
      tone(ARP[i], ARP[i], nextT, EIGHTH * 0.8, 'triangle', 0.1);
      nextT += EIGHTH; stepIdx++;
    }
  }
  function sfxJump() { if (AC) tone(380, 760, AC.currentTime, 0.12, 'square', 0.12); }
  function sfxDie() { if (AC) tone(260, 40, AC.currentTime, 0.35, 'sawtooth', 0.25); }
  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

  // ---------- güncelle ----------
  function update(dt) {
    time += dt;
    if (state === 'playing') {
      acc += dt;
      while (acc >= STEP) {
        acc -= STEP;
        stepPlayer(p, hold, STEP);
        if (p.jumped) sfxJump();
        if (p.dead) { die(); break; }
        if (p.x >= END) { win(); break; }
      }
      if (state === 'playing') {
        if (!p.ground) rot += (Math.PI / 0.56) * dt;
        else {
          const target = Math.round(rot / (Math.PI / 2)) * (Math.PI / 2);
          rot += (target - rot) * Math.min(1, dt * 22);
          trailT -= dt;
          if (trailT <= 0) {
            trailT = 0.035;
            particles.push({ x: p.x + 4, y: p.y + P - 6, vx: -90 - Math.random() * 60, vy: -30 - Math.random() * 60,
              life: 0.35, max: 0.35, s: 4 + Math.random() * 4, c: '#3ef0ff' });
          }
        }
      }
    } else if (state === 'dead') {
      deadT -= dt;
      if (deadT <= 0) restart();
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 900 * dt;
    }
  }

  // ---------- çiz ----------
  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const prog = Math.min(1, p.x / END);
    const hue = 230 + prog * 130;
    const accent = 'hsl(' + ((hue + 150) % 360) + ',95%,62%)';
    const camX = p.x - 170;

    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, 'hsl(' + hue + ',65%,16%)');
    g.addColorStop(1, 'hsl(' + (hue + 30) + ',70%,34%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // uzak siluetler
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 9; i++) {
      const bw = 80 + ((i * 37) % 70), bh = 70 + ((i * 53) % 150);
      const x = (((i * 190 - camX * 0.25) % 1710) + 1710) % 1710 - 120;
      ctx.fillRect(x, GROUND - bh, bw, bh);
    }
    // vuruş parlaması
    const phase = (time * BPM / 60) % 1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.07 * (1 - phase)).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);

    // zemin
    ctx.fillStyle = 'hsl(' + hue + ',55%,9%)';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const off = ((camX % T) + T) % T;
    for (let x = -off; x < W; x += T) { ctx.moveTo(x, GROUND); ctx.lineTo(x, H); }
    for (let y = GROUND + T; y < H; y += T) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.fillStyle = accent;
    ctx.fillRect(0, GROUND - 2, W, 4);

    // bloklar
    blocks.forEach((b) => {
      const bx = b.x - camX;
      if (bx > W + 10 || bx + b.w < -10) return;
      for (let cx = 0; cx < b.w; cx += T) {
        for (let cy = 0; cy < b.h; cy += T) {
          ctx.fillStyle = 'rgba(8,12,34,0.92)';
          ctx.fillRect(bx + cx, b.y + cy, T, T);
          ctx.strokeStyle = accent;
          ctx.lineWidth = 2;
          ctx.strokeRect(bx + cx + 1.5, b.y + cy + 1.5, T - 3, T - 3);
        }
      }
    });

    // dikenler
    spikes.forEach((s) => {
      const sx = s.x - camX;
      if (sx > W + 10 || sx + T < -10) return;
      ctx.beginPath();
      ctx.moveTo(sx + 2, s.base);
      ctx.lineTo(sx + T / 2, s.base - T + 2);
      ctx.lineTo(sx + T - 2, s.base);
      ctx.closePath();
      ctx.fillStyle = '#0a0d1f';
      ctx.fill();
      ctx.strokeStyle = '#ff4f8b';
      ctx.lineWidth = 3;
      ctx.stroke();
    });

    // bitiş çizgisi
    const ex = END - camX;
    if (ex < W + 20) {
      for (let i = 0; i < 9; i++) {
        ctx.fillStyle = i % 2 ? '#ffffff' : '#111111';
        ctx.fillRect(ex, GROUND - (i + 1) * 40, 20, 40);
        ctx.fillStyle = i % 2 ? '#111111' : '#ffffff';
        ctx.fillRect(ex + 20, GROUND - (i + 1) * 40, 20, 40);
      }
    }

    // parçacıklar
    particles.forEach((q) => {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x - camX - q.s / 2, q.y - q.s / 2, q.s, q.s);
    });
    ctx.globalAlpha = 1;

    // oyuncu
    if (state !== 'dead') {
      ctx.save();
      ctx.translate(p.x - camX + P / 2, p.y + P / 2);
      ctx.rotate(rot);
      ctx.fillStyle = '#3ef0ff';
      ctx.fillRect(-P / 2, -P / 2, P, P);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(-P / 2 + 1.5, -P / 2 + 1.5, P - 3, P - 3);
      ctx.fillStyle = '#0b1a3a';
      ctx.fillRect(-14, -12, 28, 16);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-9, -8, 7, 8);
      ctx.fillRect(3, -8, 7, 8);
      ctx.fillStyle = '#0b1a3a';
      ctx.fillRect(-14, 9, 28, 5);
      ctx.restore();
    }

    // arayüz
    const pc = state === 'won' ? 100 : pct();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(250, 14, 300, 12);
    ctx.fillStyle = accent;
    ctx.fillRect(250, 14, 300 * (pc / 100), 12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('%' + pc, 560, 26);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '14px "Trebuchet MS", sans-serif';
    ctx.fillText('Deneme ' + attempt, 14, 24);
    ctx.fillText('En iyi %' + best, 14, 44);
  }

  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

function card(o,tag){const b=document.createElement('div');b.className='g';
const bg=o.image?`background-image:url('${o.image}')`:`background:${o.color||'#5b5bf0'}`;
b.innerHTML=`<div class="th" style="${bg}">${o.image?'':(o.emoji||'🎮')}</div><b></b><small></small>${tag?`<span class="tag">${tag}</span>`:''}<button class="fv">${favs.includes(o.name)?'★':'☆'}</button>`;
b.querySelector('b').textContent=o.name;b.querySelector('small').textContent=o.desc||o.cat||'';
b.onclick=e=>{if(e.target.className=='fv'){e.stopPropagation();tog(o.name);return}start(o)};return b}
function tog(n){favs=favs.includes(n)?favs.filter(x=>x!=n):[...favs,n];sv('zk_favs',favs);render()}
function fill(id,list,tagf){const g=$(id);g.innerHTML='';list.forEach(o=>g.appendChild(card(o,tagf&&tagf(o))));g.parentElement.style.display=list.length?'block':'none'}
function render(){const f=$('q').value.trim().toLowerCase(),cats=['Hepsi',...new Set(GAMES.map(g=>g.cat).filter(Boolean)),'Favoriler'];
$('nav').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==cat?' on':'');b.textContent=c=='Favoriler'?'★ Favoriler':c;b.onclick=()=>{cat=c;render()};$('nav').appendChild(b)});
let list=GAMES.filter(o=>o.name.toLowerCase().includes(f)&&(cat=='Hepsi'||(cat=='Favoriler'?favs.includes(o.name):o.cat==cat)));
const home=!f&&cat=='Hepsi',ft=[...GAMES].reverse().find(o=>o.featured);
$('hero').style.display=home&&ft?'flex':'none';$('secs').style.display=home?'block':'none';
if(home&&ft){const h=$('hero');h.style.background=ft.image?`url('${ft.image}') center/cover`:`linear-gradient(120deg,${ft.color||'#5b5bf0'},#0b0d17)`;$('hem').textContent=ft.image?'':ft.emoji||'';$('ht').textContent=ft.name;$('hd').textContent=ft.desc||'';$('hp').onclick=()=>start(ft)}
if(home){fill('g-new',[...GAMES].reverse().slice(0,6),()=>'YENİ');fill('g-pop',[...GAMES].sort((a,b)=>(plays[b.name]||0)-(plays[a.name]||0)).filter(o=>plays[o.name]).slice(0,6),o=>'🔥 '+plays[o.name])}
$('allt').textContent=home?'🎮 Tüm Oyunlar':'🔎 Sonuçlar';$('grid').innerHTML='';list.forEach(o=>$('grid').appendChild(card(o)));
$('empty').style.display=list.length?'none':'block';$('empty').textContent=GAMES.length?'Bu aramada oyun bulunamadı.':'Henüz oyun yok. index.html içindeki GAMES listesine oyunlarını ekle.'}
function start(o){cur=o;plays[o.name]=(plays[o.name]||0)+1;sv('zk_plays',plays);$('gt').textContent=o.emoji+' '+o.name;$('fr').srcdoc='<!DOCTYPE html>'+document.getElementById('g-'+o.id).innerHTML;$('modal').style.display='flex';favbtn()}
function favbtn(){$('fav').textContent=favs.includes(cur.name)?'★ Favoride':'☆ Favori'}
$('fav').onclick=()=>{tog(cur.name);favbtn()};
$('fs').onclick=()=>{const f=$('fr');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
$('x').onclick=()=>{$('fr').srcdoc='';$('modal').style.display='none';render()};
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('modal').style.display=='flex')$('x').click()});
function reset(){$('q').value='';cat='Hepsi';render();scrollTo(0,0)}
$('q').oninput=render;render();
</script></body></html>
