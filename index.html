<script>

    if(!dead&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+11){hurt();kill(e,1);dead=true}
    if(dead)E.splice(i,1)}
  for(let i=PU.length-1;i>=0;i--){const p=PU[i];p.y+=70*dt;if(p.y>H+20){PU.splice(i,1);continue}
    if(Math.hypot(p.x-P.x,p.y-P.y)<24){PU.splice(i,1);SFX.power();sc+=50;if(p.k==='w')wl=Math.min(3,wl+1);else if(p.k==='s')shield=1;else lives=Math.min(5,lives+1)}}
}
function fx(dt){
  for(const s of stars){s.y+=s.sp*dt*(state==='play'?1:.4);if(s.y>H){s.y=-4;s.x=Math.random()*W}}
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}if(p.ring)p.r+=300*dt;else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98}}
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);
}

// ---------- Çizim ----------
function drawEnemy(e){x.save();x.translate(e.x,e.y);const f=e.fl>0;
  if(e.k==='drone'){poly([[0,14],[12,4],[10,-10],[0,-14],[-10,-10],[-12,4]],f?'#fff':'#8a4fff','#d6b8ff');x.fillStyle='#ff4d6d';x.beginPath();x.arc(0,0,4,0,6.283);x.fill()}
  else if(e.k==='zig'){poly([[0,15],[14,-10],[0,-4],[-14,-10]],f?'#fff':'#ff8a3d','#ffd0a0');x.fillStyle='#fff3';x.fillRect(-2,-2,4,8)}
  else if(e.k==='shoot'){x.fillStyle=f?'#fff':'#2fbf7a';x.beginPath();x.arc(0,0,15,0,6.283);x.fill();x.strokeStyle='#a8ffd4';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,2,6,0,6.283);x.fill();x.fillStyle='#103';x.beginPath();x.arc(0,3,3,0,6.283);x.fill()}
  else{poly([[-10,-22],[10,-22],[22,-8],[22,8],[10,22],[-10,22],[-22,8],[-22,-8]],f?'#fff':'#5b6f8f','#a8c0e8');x.fillStyle='#2b3850';x.fillRect(-5,-10,10,26);x.fillStyle='#ff4d6d';x.beginPath();x.arc(0,-2,5,0,6.283);x.fill()}
  x.restore();
  if(e.hp<e.max){x.fillStyle='#0008';x.fillRect(e.x-14,e.y-e.r-9,28,4);x.fillStyle='#ff4d6d';x.fillRect(e.x-13,e.y-e.r-8,26*e.hp/e.max,2)}}
function drawPlayer(){if(P.inv>0&&Math.floor(t*14)%2)return;x.save();x.translate(P.x,P.y);
  const fl=10+Math.random()*9;poly([[-5,14],[5,14],[0,14+fl]],'#ffb347');poly([[-2.5,14],[2.5,14],[0,14+fl*.55]],'#fff7d0');
  const g=x.createLinearGradient(0,-22,0,16);g.addColorStop(0,'#f2fbff');g.addColorStop(1,'#3f8fe8');
  poly([[0,-22],[7,-6],[18,12],[9,10],[5,16],[-5,16],[-9,10],[-18,12],[-7,-6]],g,'#bfe6ff');
  x.fillStyle='#10244a';x.beginPath();x.ellipse(0,-3,3.5,7,0,0,6.283);x.fill();x.fillStyle='#7fd4ff88';x.beginPath();x.ellipse(-1,-5,1.5,3,0,0,6.283);x.fill();x.restore();
  x.globalCompositeOperation='lighter';gl('o',P.x,P.y+22,22,.5);x.globalCompositeOperation='source-over';
  if(shield){x.strokeStyle='rgba(120,220,255,'+(.55+.25*Math.sin(t*8))+')';x.lineWidth=2.5;x.beginPath();x.arc(P.x,P.y,27,0,6.283);x.stroke()}}
function draw(){
  x.save();x.drawImage(BG,0,0);
  x.fillStyle='#fff';for(const s of stars){x.globalAlpha=.25+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s*(1+s.sp*.03))}x.globalAlpha=1;
  if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(const p of PU){const c={w:'y',s:'c',h:'g'}[p.k],yy=p.y+Math.sin(t*5+p.x)*3;x.globalCompositeOperation='lighter';gl(c,p.x,yy,24,.9);x.globalCompositeOperation='source-over';
    x.fillStyle='#fff';x.font='bold 15px system-ui';x.textAlign='center';x.fillText({w:'W',s:'S',h:'+'}[p.k],p.x,yy+5)}
  for(const e of E)drawEnemy(e);
  x.globalCompositeOperation='lighter';
  for(const b of PB){gl('c',b.x,b.y,15,.9)}for(const b of EB){gl('r',b.x,b.y,13,.95)}
  x.globalCompositeOperation='source-over';
  x.fillStyle='#fff';for(const b of PB)x.fillRect(b.x-1.5,b.y-8,3,12);x.fillStyle='#ffd6d6';for(const b of EB){x.beginPath();x.arc(b.x,b.y,3.2,0,6.283);x.fill()}
  if(state!=='over')drawPlayer();
  x.globalCompositeOperation='lighter';
  for(const p of PT){const a=p.l/p.m;if(p.ring){x.strokeStyle='rgba(255,200,120,'+a+')';x.lineWidth=3*a;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.stroke()}else gl(p.g,p.x,p.y,p.s*(.5+a),Math.min(1,a*1.5))}
  x.globalCompositeOperation='source-over';x.restore();
  x.drawImage(VG,0,0);
  if(flash){x.fillStyle='rgba(255,60,60,'+Math.min(.4,flash*1.6)+')';x.fillRect(0,0,W,H)}
  if(state!=='menu'){x.textAlign='left';x.fillStyle='#fff';x.font='bold 24px system-ui,sans-serif';x.fillText(sc,14,32);
    x.font='11px system-ui,sans-serif';x.fillStyle='#9fb0d0';x.fillText('REKOR '+Math.max(hi,sc),14,48);
    x.font='18px system-ui,sans-serif';x.fillStyle='#ff4d6d';for(let i=0;i<lives;i++)x.fillText('♥',14+i*20,72);
    x.font='11px system-ui,sans-serif';x.fillStyle='#ffe164';x.fillText('SİLAH '+'▮'.repeat(wl),14,90);if(shield){x.fillStyle='#7fe0ff';x.fillText('KALKAN',90,90)}}
}

// ---------- Arayüz ve girdi ----------
function showOv(h,p,b,fn){ov.style.display='flex';ov.innerHTML='<h1>'+h+'</h1><p>'+p+'</p><button>'+b+'</button>';ov.querySelector('button').onclick=()=>{initAudio();fn()}}
function hideOv(){ov.style.display='none'}
function pause(){if(state!=='play')return;firing=false;state='pause';showOv('Duraklatıldı','Oyun durdu.','Devam et',()=>{hideOv();state='play'})}
function mv(e){if(state!=='play')return;e.preventDefault();const r=cv.getBoundingClientRect();P.tx=(e.clientX-r.left)*W/r.width;P.ty=(e.clientY-r.top)*H/r.height-(e.pointerType==='mouse'?0:70)}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}firing=true;mv(e)});
addEventListener('pointerup',()=>firing=false);addEventListener('pointercancel',()=>firing=false);
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)mv(e)});
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(e.code==='Escape'||e.code==='KeyP')pause();if(e.code==='KeyM')muteB.onclick()});
addEventListener('keyup',e=>K[e.code]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();last=performance.now()});

let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(state==='play')update(dt);fx(dt);draw();requestAnimationFrame(loop)}
P={x:W/2,y:520,tx:W/2,ty:520,inv:0};
showOv('Yıldız Savaşı','Parmağınla sürükle ya da fare / WASD kullan. Ateş için tıkla veya basılı tut (Boşluk da çalışır). W, S ve + güçlendirmelerini topla.','Başla',start);
requestAnimationFrame(loop);
</script>
</body>
</html>

</template>
<script>
/* ===== OYUN EKLEME =====
 1) Oyunun tam HTML kodunu aşağıdaki gibi <template id="g-OYUNID"> ... </template> içine yapıştır (script'in üstüne).
 2) GAMES listesine bir satır ekle: {name:'Oyun Adı', id:'OYUNID', emoji:'🎯', color:'#6a9a4a', desc:'Kısa açıklama', cat:'Aksiyon'},
 Kapak resmi için emoji yerine: image:'resim-adresi' */
const GAMES=[
{name:'Blok Patlat',id:'blockblast',emoji:'🧩',color:'#5b3fd1',desc:'Blokları yerleştir, satırları patlat, kombo yap!',cat:'Bulmaca',featured:true},
{name:'2048',id:'g2048',emoji:'🔢',color:'#e0a030',desc:'Sayıları birleştir, 2048\'e ulaş!',cat:'Bulmaca'},
{name:'Ok Düellosu',id:'ok',emoji:'🏹',color:'#b8472f',desc:'Online oda kodu, 5 vuruşta kazan!',cat:'Aksiyon'},
{name:'DX Ball',id:'dxball',emoji:'🧱',color:'#2f7fd1',desc:'Topu zıplat, tuğlaları kır!',cat:'Arcade'},
{name:'Zıpla',id:'flappy',emoji:'🐤',color:'#3aa6d9',desc:'Borulara çarpmadan geç!',cat:'Arcade'},
{name:'Yıldız Savaşı',id:'yildiz',emoji:'🚀',color:'#4b3fd1',desc:'Uzay gemisiyle düşmanları vur!',cat:'Aksiyon'},
];
const $=id=>document.getElementById(id);let cat='Hepsi',cur=null;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let plays=ld('zk_plays',{}),favs=ld('zk_favs',[]);
function card(o,tag){const b=document.createElement('div');b.className='g';
const bg=o.image?`background-image:url('${o.image}')`:`background:${o.color||'#5b5bf0'}`;
b.innerHTML=`<div class="th" style="${bg}">${o.image?'':(o.emoji||'🎮')}</div><b></b><small></small>${tag?`<span class="tag">${tag}</span>`:''}<button class="fv">${favs.includes(o.name)?'★':'☆'}</button>`;
b.querySelector('b').textContent=o.name;b.querySelector('small').textContent=o.desc||o.cat||'';
b.onclick=e=>{if(e.target.className=='fv'){e.stopPropagation();tog(o.name);return}start(o)};return b}
function tog(n){favs=favs.includes(n)?favs.filter(x=>x!=n):[...favs,n];sv('zk_favs',favs);render()}
function fill(id,list,tagf){const g=$(id);g.innerHTML='';list.forEach(o=>g.appendChild(card(o,tagf&&tagf(o))));g.parentElement.style.display=list.length?'block':'none'}
function render(){const f=$('q').value.trim().toLowerCase(),cats=['Hepsi',...new Set(GAMES.map(g=>g.cat).filter(Boolean)),'Favoriler'];
$('nav').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==cat?' on':'');b.textContent=c=='Favoriler'?'★ Favoriler':c;b.onclick=()=>{cat=c;render()};$('nav').appendChild(b)});
let list=GAMES.filter(o=>o.name.toLowerCase().includes(f)&&(cat=='Hepsi'||(cat=='Favoriler'?favs.includes(o.name):o.cat==cat)));
const home=!f&&cat=='Hepsi',ft=[...GAMES].reverse().find(o=>o.featured);
$('hero').style.display=home&&ft?'flex':'none';$('secs').style.display=home?'block':'none';
if(home&&ft){const h=$('hero');h.style.background=ft.image?`url('${ft.image}') center/cover`:`linear-gradient(120deg,${ft.color||'#5b5bf0'},#0b0d17)`;$('hem').textContent=ft.image?'':ft.emoji||'';$('ht').textContent=ft.name;$('hd').textContent=ft.desc||'';$('hp').onclick=()=>start(ft)}
if(home){fill('g-new',[...GAMES].reverse().slice(0,6),()=>'YENİ');fill('g-pop',[...GAMES].sort((a,b)=>(plays[b.name]||0)-(plays[a.name]||0)).filter(o=>plays[o.name]).slice(0,6),o=>'🔥 '+plays[o.name])}
$('allt').textContent=home?'🎮 Tüm Oyunlar':'🔎 Sonuçlar';$('grid').innerHTML='';list.forEach(o=>$('grid').appendChild(card(o)));
$('empty').style.display=list.length?'none':'block';$('empty').textContent=GAMES.length?'Bu aramada oyun bulunamadı.':'Henüz oyun yok. index.html içindeki GAMES listesine oyunlarını ekle.'}
function start(o){cur=o;plays[o.name]=(plays[o.name]||0)+1;sv('zk_plays',plays);$('gt').textContent=o.emoji+' '+o.name;$('fr').srcdoc='<!DOCTYPE html>'+document.getElementById('g-'+o.id).innerHTML;$('modal').style.display='flex';favbtn()}
function favbtn(){$('fav').textContent=favs.includes(cur.name)?'★ Favoride':'☆ Favori'}
$('fav').onclick=()=>{tog(cur.name);favbtn()};
$('fs').onclick=()=>{const f=$('fr');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
$('x').onclick=()=>{$('fr').srcdoc='';$('modal').style.display='none';render()};
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('modal').style.display=='flex')$('x').click()});
function reset(){$('q').value='';cat='Hepsi';render();scrollTo(0,0)}
$('q').oninput=render;render();
</script></body></html>
